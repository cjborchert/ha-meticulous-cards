name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  # Checks that dist/ was rebuilt from src/. Only for release tags, pull requests and manual runs:
  # changes uploaded through the GitHub website arrive as several commits (src, then dist), and the
  # in-between commit would otherwise fail and send a notification.
  build:
    name: dist is up to date
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build
      - run: git diff --exit-code dist/
